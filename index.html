<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff7ec" />
    <title>块乐星球 · 把快乐，一块一块拼完整</title>
    <style>#boot-loader{z-index:5;color:#71717a;background:linear-gradient(#fffdf7 0%,#fff3e2 100%);flex-direction:column;justify-content:center;align-items:center;gap:24px;font-family:LXGW WenKai,PingFang SC,Microsoft YaHei,sans-serif;transition:opacity .4s;display:flex;position:fixed;inset:0}#boot-loader.hide{opacity:0;pointer-events:none}#boot-loader .boot-star{background:#ffd9a0;border-radius:50%;width:72px;height:72px;animation:1.2s ease-in-out infinite boot-pulse;box-shadow:0 0 0 10px #ffd9a059,0 0 0 20px #ffd9a02e}#boot-loader .boot-text{letter-spacing:2px;font-size:18px}@keyframes boot-pulse{0%,to{opacity:.7;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}</style>
    <script type="module" crossorigin src="./assets/index-DFuo2MaQ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dlw3Qzun.css">
    <script src="https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze-game/js/phaser-bridge.min.js?hash=1793249746472"></script>
  </head>
  <body>
    <main id="game" aria-label="Phaser game canvas"></main>

    <!-- 首屏加载动画（游戏画布就绪后由 BootScene 移除） -->
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-star"></div>
      <div class="boot-text">块乐星球 加载中…</div>
    </div>


    <!-- 竖屏引导：App 为强制横屏，Web 端无法锁定方向，只能提示 -->
    <div id="rotate-hint" class="rotate-hint" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-phone">📱</div>
        <p class="rotate-title">请把手机横过来</p>
        <p class="rotate-sub">块乐星球 是横屏拼图游戏</p>
      </div>
    </div>

  </body>
</html>
