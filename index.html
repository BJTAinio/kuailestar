<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fff7ec" />
    <title>块乐星球 · 把快乐，一块一块拼完整</title>
    <style>
      /* 首屏加载动画：在游戏代码与字体就绪前立即显示，避免白屏 */
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: linear-gradient(180deg, #fffdf7 0%, #fff3e2 100%);
        font-family: "LXGW WenKai", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: #71717a;
        transition: opacity 0.4s ease;
      }
      #boot-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #boot-loader .boot-star {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #ffd9a0;
        box-shadow: 0 0 0 10px rgba(255, 217, 160, 0.35),
          0 0 0 20px rgba(255, 217, 160, 0.18);
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot-loader .boot-text {
        font-size: 18px;
        letter-spacing: 2px;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BvNTGvVi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-4vGWlwYJ.css">
    <script src="https://lf-coze-web-cdn.coze.cn/obj/eden-cn/lm-lgvj/ljhwZthlaukjlkulzlp/coze-game/js/phaser-bridge.min.js?hash=1793272641549"></script>
  </head>
  <body>
    <main id="game" aria-label="Phaser game canvas"></main>

    <!-- 首屏加载动画（游戏画布就绪后由 BootScene 移除） -->
    <div id="boot-loader" aria-hidden="true">
      <div class="boot-star"></div>
      <div class="boot-text">块乐星球 加载中…</div>
    </div>


    <!-- 竖屏引导：App 为强制横屏，Web 端无法锁定方向，只能提示 -->
    <div id="rotate-hint" class="rotate-hint" aria-hidden="true">
      <div class="rotate-card">
        <div class="rotate-phone">📱</div>
        <p class="rotate-title">请把手机横过来</p>
        <p class="rotate-sub">块乐星球 是横屏拼图游戏</p>
      </div>
    </div>

  </body>
</html>
